<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" role="img" aria-labelledby="t d">
  <title id="t">How codemitvishal.github.io works</title>
  <desc id="d">Content in data.js and hand-written translations are built with React and Vite and published to GitHub Pages. In the visitor's browser the language picker loads a translation file or opens Google's machine translation. The AI assistant sends questions to a Cloudflare Worker, which checks the request, picks the relevant website content and asks Workers AI for an answer.</desc>
  <style>
    .bg { fill: #f4f1ea; }
    .panel { fill: #ebe6db; stroke: #d6cfc1; }
    .box { fill: #fbf9f4; stroke: #18171b; stroke-width: 1.4; }
    .box.hot { stroke: #b23f0e; stroke-width: 2; }
    .title { font: 400 30px Georgia, 'Times New Roman', serif; fill: #18171b; }
    .h { font: 600 12px ui-monospace, Consolas, monospace; letter-spacing: .08em; fill: #b23f0e; text-transform: uppercase; }
    .b { font: 600 14px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #18171b; }
    .s { font: 400 11.5px ui-monospace, Consolas, monospace; fill: #6b665f; }
    .note { font: italic 400 14px Georgia, serif; fill: #6b665f; }
    .wire { fill: none; stroke: #18171b; stroke-width: 1.6; stroke-dasharray: 7 7; animation: flow 1.1s linear infinite; }
    .wire.ai { stroke: #b23f0e; }
    .wire.soft { stroke: #9a948a; stroke-dasharray: 3 6; animation-duration: 1.8s; }
    .dot { fill: #b23f0e; }
    .tag { fill: #18171b; } .tagtxt { font: 600 10.5px ui-monospace, Consolas, monospace; fill: #f4f1ea; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .wire, .pulse { animation: none; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#18171b"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b23f0e"/></marker>
  </defs>

  <rect class="bg" width="1120" height="660"/>
  <text class="title" x="40" y="54">How codemitvishal.github.io works</text>
  <text class="note" x="40" y="80">Content, translations and the AI assistant, end to end.</text>

  <!-- column panels -->
  <rect class="panel" x="30" y="104" width="320" height="520" rx="4"/>
  <rect class="panel" x="400" y="104" width="320" height="520" rx="4"/>
  <rect class="panel" x="770" y="104" width="320" height="520" rx="4"/>
  <text class="h" x="50" y="132">1 · Content &amp; build</text>
  <text class="h" x="420" y="132">2 · Visitor's browser</text>
  <text class="h" x="790" y="132">3 · AI assistant (free tier)</text>

  <!-- column 1 -->
  <rect class="box" x="50" y="150" width="280" height="58"/>
  <text class="b" x="64" y="175">src/data.js</text><text class="s" x="64" y="195">all content: jobs, projects, skills</text>
  <rect class="box" x="50" y="228" width="280" height="58"/>
  <text class="b" x="64" y="253">src/i18n/*.js</text><text class="s" x="64" y="273">10 hand-written translations</text>
  <rect class="box" x="50" y="306" width="280" height="58"/>
  <text class="b" x="64" y="331">React + Vite build</text><text class="s" x="64" y="351">one dictionary file per language</text>
  <rect class="box" x="50" y="384" width="280" height="58"/>
  <text class="b" x="64" y="409">npm run deploy</text><text class="s" x="64" y="429">pushes dist/ to the gh-pages branch</text>
  <rect class="box hot" x="50" y="462" width="280" height="58"/>
  <text class="b" x="64" y="487">GitHub Pages</text><text class="s" x="64" y="507">serves codemitvishal.github.io</text>
  <rect class="box" x="50" y="540" width="280" height="58"/>
  <text class="b" x="64" y="565">src/knowledge.js</text><text class="s" x="64" y="585">data.js → small searchable chunks</text>

  <path class="wire" d="M190 208 V228" marker-end="url(#arrow)"/>
  <path class="wire" d="M190 286 V306" marker-end="url(#arrow)"/>
  <path class="wire" d="M190 364 V384" marker-end="url(#arrow)"/>
  <path class="wire" d="M190 442 V462" marker-end="url(#arrow)"/>

  <!-- column 2 -->
  <rect class="box hot" x="420" y="150" width="280" height="58"/>
  <text class="b" x="434" y="175">The page (English by default)</text><text class="s" x="434" y="195">no flags · endonyms · remembers choice</text>
  <rect class="box" x="420" y="240" width="280" height="76"/>
  <text class="b" x="434" y="265">Language picker  🌐</text>
  <text class="s" x="434" y="285">Europe: EN DE FR ES IT  (+ more)</text>
  <text class="s" x="434" y="303">India: HI BN MR TE TA GU  (+ more)</text>
  <rect class="box" x="420" y="340" width="134" height="70"/>
  <text class="b" x="432" y="364">Hand-translated</text><text class="s" x="432" y="384">loads one file</text><text class="s" x="432" y="400">instant switch</text>
  <rect class="box" x="566" y="340" width="134" height="70"/>
  <text class="b" x="578" y="364">More languages</text><text class="s" x="578" y="384">Google machine</text><text class="s" x="578" y="400">translation</text>
  <rect class="box hot" x="420" y="440" width="280" height="76"/>
  <text class="b" x="434" y="465">AI chat panel  ✦</text><text class="s" x="434" y="485">asks in the visitor's language</text><text class="s" x="434" y="503">answers in that language</text>
  <rect class="box" x="420" y="540" width="280" height="58"/>
  <text class="b" x="434" y="565">On-page search fallback</text><text class="s" x="434" y="585">if the AI is offline or out of quota</text>

  <path class="wire" d="M560 208 V240" marker-end="url(#arrow)"/>
  <path class="wire" d="M487 316 V340" marker-end="url(#arrow)"/>
  <path class="wire" d="M633 316 V340" marker-end="url(#arrow)"/>
  <path class="wire soft" d="M560 516 V540" marker-end="url(#arrow)"/>

  <!-- column 1 -> 2 -->
  <path id="publish" class="wire" d="M330 491 C 370 491, 370 179, 420 179" marker-end="url(#arrow)"/>
  <path class="wire soft" d="M330 257 C 375 257, 380 375, 420 375" marker-end="url(#arrow)"/>
  <circle class="dot" r="4"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#publish"/></animateMotion></circle>

  <!-- column 3 -->
  <rect class="box hot" x="790" y="150" width="280" height="92"/>
  <text class="b" x="804" y="175">Cloudflare Worker  POST /chat</text>
  <text class="s" x="804" y="195">✓ only this site may call it (CORS)</text>
  <text class="s" x="804" y="213">✓ 8 requests / minute / visitor</text>
  <text class="s" x="804" y="231">✓ size limits · no system-role injection</text>
  <rect class="box" x="790" y="270" width="280" height="58"/>
  <text class="b" x="804" y="295">Retrieve relevant content</text><text class="s" x="804" y="315">knowledge.js keyword search</text>
  <rect class="box" x="790" y="356" width="280" height="76"/>
  <text class="b" x="804" y="381">Workers AI · Gemma 4</text><text class="s" x="804" y="401">answers ONLY from that content</text><text class="s" x="804" y="419">10,000 free units/day, then stops</text>
  <rect class="box" x="790" y="460" width="280" height="76"/>
  <text class="b" x="804" y="485">No API keys anywhere</text><text class="s" x="804" y="505">AI binding inside Cloudflare;</text><text class="s" x="804" y="523">nothing secret in the browser</text>
  <g class="pulse"><rect class="tag" x="790" y="560" width="132" height="22" rx="11"/><text class="tagtxt" x="804" y="575">public data only</text></g>

  <path class="wire ai" d="M930 242 V270" marker-end="url(#arrowA)"/>
  <path class="wire ai" d="M930 328 V356" marker-end="url(#arrowA)"/>
  <path class="wire soft" d="M330 590 Q 720 648 1098 612 L1098 300 L1074 300" marker-end="url(#arrow)"/>

  <!-- column 2 <-> 3 -->
  <path id="ask" class="wire ai" d="M700 466 C 750 466, 740 196, 790 196" marker-end="url(#arrowA)"/>
  <path id="answer" class="wire ai" d="M790 410 C 745 410, 750 492, 700 492" marker-end="url(#arrowA)"/>
  <circle class="dot" r="4"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#ask"/></animateMotion></circle>
  <circle class="dot" r="4"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#answer"/></animateMotion></circle>
</svg>
